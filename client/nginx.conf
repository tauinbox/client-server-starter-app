# Access log without the query string or the Referer. The mailed verify-email,
# reset-password and confirm-email-change links carry a one-time token in
# `?token=`, and a Referer repeats that URL on every later same-origin request.
# `$uri` is not used because after try_files it is /index.html for every route.
map $request_uri $nexus_log_path { "~^(?<p>[^?]*)" $p; }
log_format nexus_redacted '$remote_addr - $remote_user [$time_local] "$request_method $nexus_log_path $server_protocol" $status $body_bytes_sent "$http_user_agent"';

upstream backend {
    server server:3000;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    access_log /var/log/nginx/access.log nexus_redacted;
    root /usr/share/nginx/html;
    index index.html;

    # A location with its own add_header drops every inherited one by default.
    # merge keeps these security headers on every response, so each location adds
    # only its Cache-Control. The directive needs nginx 1.29.3 or later.
    add_header_inherit merge;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # style-src: 'unsafe-inline' required for Angular Material dynamic style injection
    # script-src: no 'unsafe-hashes' needed — inlineCritical:false in angular.json removes
    #   the onload="this.media='all'" handler that Angular CLI otherwise injects into index.html
    # script-src/frame-src https://challenges.cloudflare.com — Cloudflare Turnstile CAPTCHA
    #   widget (script + iframe). Used by /register and /forgot-password soft-trigger.
    # frame-ancestors: CSP-level enforcement of X-Frame-Options DENY (CSP2+)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' ws: wss:; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Block external access to Prometheus metrics — scraped internally via server:3000/metrics
    location = /metrics {
        return 404;
    }

    # Angular content-hashed bundles — safe to cache aggressively; hash changes on every build
    location ~* \.(js|css|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|ico|webp)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA shell — always revalidate so new deployments take effect immediately
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
