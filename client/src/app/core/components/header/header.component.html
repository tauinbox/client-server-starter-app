<mat-toolbar *transloco="let t">
  @if (authStore.isAuthenticated() && sidenavState.isMobile()) {
    <button
      matIconButton
      (click)="sidenavState.toggleMobileOpen()"
      [attr.aria-label]="t('sidenav.openNavigation')"
    >
      <mat-icon>menu</mat-icon>
    </button>
  }
  <span class="app-brand" [matTooltip]="appVersion()">{{ appName }}</span>
  <span class="spacer"></span>

  <nxs-language-switcher></nxs-language-switcher>
  <nxs-theme-toggle></nxs-theme-toggle>

  @if (notices.available()) {
    @let unread = notices.unread();
    <a
      matIconButton
      class="notices-link"
      [routerLink]="noticesLink"
      routerLinkActive="active"
      [matTooltip]="t('header.notifications')"
      [attr.aria-label]="
        unread > 0
          ? t('header.notificationsUnread', { count: unread })
          : t('header.notifications')
      "
    >
      <mat-icon
        [matBadge]="unread"
        [matBadgeHidden]="unread === 0"
        aria-hidden="true"
        >notifications</mat-icon
      >
    </a>
  }

  @if (authStore.isAuthenticated()) {
    <button matButton="text" [matMenuTriggerFor]="menu">
      {{ authStore.user()?.name }}
      <mat-icon aria-hidden="true">expand_more</mat-icon>
    </button>
    <mat-menu #menu="matMenu">
      <button mat-menu-item (click)="logout()">
        <mat-icon aria-hidden="true">logout</mat-icon>
        <span>{{ t('header.logout') }}</span>
      </button>
    </mat-menu>
  } @else {
    <button
      matButton="text"
      [routerLink]="'/' + routes.Login"
      routerLinkActive="active"
    >
      {{ t('header.login') }}
    </button>
    <button
      matButton="text"
      [routerLink]="'/' + routes.Register"
      routerLinkActive="active"
    >
      {{ t('header.register') }}
    </button>
  }
</mat-toolbar>
