<mat-card
  appearance="outlined"
  class="usage-card"
  *transloco="let t; scope: 'billing'"
>
  <mat-card-content>
    <div class="usage-header">
      <h2 class="card-heading">{{ t('billing.usage.title') }}</h2>
    </div>

    @if (usage().unitsSpent === 0) {
      <p class="usage-empty">{{ t('billing.usage.empty') }}</p>
    } @else {
      <p class="usage-readout">
        <span class="total">{{ spentLabel() }}</span>
        <span class="readout-caption">{{ t('billing.usage.unitsUsed') }}</span>
      </p>
    }

    <p class="usage-period">
      <span>
        {{ usage().periodStart | localizedDate: 'mediumDate' : 'UTC' }} –
        {{ usage().periodEnd | localizedDate: 'mediumDate' : 'UTC' }}
      </span>
    </p>
  </mat-card-content>
</mat-card>
