<ng-container *transloco="let t; scope: 'admin'">
  <h2 mat-dialog-title>
    {{
      isEdit ? t('admin.roleForm.editTitle') : t('admin.roleForm.createTitle')
    }}
  </h2>

  <mat-dialog-content>
    @if (isSystemRole) {
      <p class="system-role-warning">{{ t('admin.roleForm.systemWarning') }}</p>
    }

    <form (submit)="$event.preventDefault(); submit()">
      <nxs-form-field
        [field]="roleForm.name"
        label="admin.roleForm.nameLabel"
      />

      <nxs-form-field
        [field]="roleForm.description"
        label="admin.roleForm.descriptionLabel"
        type="textarea"
      />
    </form>

    @if (errorMessage()) {
      <p class="form-error" role="alert">{{ errorMessage() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button
      matButton="text"
      type="button"
      [disabled]="isLoading()"
      (click)="cancel()"
    >
      {{ t('common.cancel') }}
    </button>
    @if (!isSystemRole) {
      <button
        matButton="filled"
        type="button"
        [disabled]="roleForm().invalid() || !formChanged || isLoading()"
        (click)="submit()"
      >
        @let submitLabel =
          isEdit ? t('common.save') : t('admin.roleForm.createButton');
        @if (isLoading()) {
          <span class="app-btn-loading">
            <mat-spinner
              [attr.aria-label]="t('common.loading')"
              diameter="18"
            />
            {{ submitLabel }}
          </span>
        } @else {
          {{ submitLabel }}
        }
      </button>
    }
  </mat-dialog-actions>
</ng-container>
