<div class="mailed-token-container" *transloco="let t; scope: 'auth'">
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ t(keyPrefix() + 'title') }}</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      @if (loading()) {
        <div class="status-container">
          <mat-spinner
            [attr.aria-label]="t('common.loading')"
            diameter="48"
          ></mat-spinner>
          <p>{{ t(keyPrefix() + 'verifying') }}</p>
        </div>
      } @else if (success()) {
        <div class="status-container success">
          <mat-icon>check_circle</mat-icon>
          <h3>{{ t(keyPrefix() + 'successTitle') }}</h3>
          <p>{{ t(keyPrefix() + 'successMessage') }}</p>
          <button matButton="filled" routerLink="/login">
            {{ t(keyPrefix() + 'goToLogin') }}
          </button>
        </div>
      } @else {
        <div class="status-container error">
          <mat-icon>error_outline</mat-icon>
          <h3>{{ t(keyPrefix() + 'failedTitle') }}</h3>
          <p>{{ error() }}</p>
          <button matButton="filled" routerLink="/login">
            {{ t(keyPrefix() + 'goToLogin') }}
          </button>
        </div>
      }
    </mat-card-content>
  </mat-card>
</div>
