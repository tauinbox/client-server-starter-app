apiVersion: 1

groups:
  - orgId: 1
    name: platform
    folder: Platform
    interval: 1m
    rules:
      # The readiness payload stays "ok" for a degraded dependency by design, so
      # this gauge is the only signal that distinguishes it from a healthy one.
      - uid: nexus-dependency-degraded
        title: Dependency degraded
        condition: B
        # Above the SMTP indicator's 5 min verify cache: a recovery can take one
        # TTL to surface, and a shorter window would alert on a stale sample.
        for: 10m
        annotations:
          summary: 'Dependency {{ $labels.dependency }} has been degraded for 10 minutes'
          description: 'The readiness probe reports {{ $labels.dependency }} as degraded or down in the last 15 minutes. Transactional mail (smtp) or rate limiting and cache invalidation (redis) are not working, while /health/ready keeps returning ok. The alert clears after 15 minutes of healthy samples.'
        labels:
          severity: warning
        # A scrape gap is not a recovery. Prometheus marks the series stale on a
        # failed scrape and a restart drops it until the first readiness probe,
        # and with noDataState: OK each gap sent a RESOLVED message and re-fired
        # 10 min later. Keeping the last state leaves a dead server to
        # nexus-server-down, which is still the only rule that reports it.
        noDataState: KeepLast
        execErrState: Error
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              # min_over_time, not the raw gauge: the mail provider accepts about
              # one login in eighty, and the indicator's 5 min verify cache turns
              # a single success into a 5 min plateau of 1. On the raw gauge that
              # plateau resolved the alert, and the next failed check re-fired it
              # 11 min later - measured 2026-09-14, two plateaus in 12 hours and
              # 144 rejected logins out of about 156 checks. One healthy sample
              # can no longer clear the condition; the cost is a real recovery
              # that needs 15 min of healthy samples to report.
              expr: min_over_time(dependency_up[15m])
              instant: true
          - refId: B
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1

      # Without this a dead server reports nothing: the dependency rule keeps
      # the state it last evaluated, which for a healthy stack is Normal.
      - uid: nexus-server-down
        title: Server unreachable
        condition: B
        for: 5m
        annotations:
          summary: 'Prometheus cannot scrape the API server'
          description: 'The nestjs-server scrape target has been down for 5 minutes. Dependency alerts are suppressed while this fires.'
        labels:
          severity: critical
        noDataState: Alerting
        execErrState: Error
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: up{job="nestjs-server"}
              instant: true
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
