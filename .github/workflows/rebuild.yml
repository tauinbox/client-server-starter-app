name: Scheduled Rebuild

on:
  schedule:
    - cron: '0 3 * * 0'  # Every Sunday at 03:00 UTC
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  rebuild-push:
    name: Rebuild & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
      issues: write
    outputs:
      sha: ${{ steps.short-sha.outputs.sha }}
      owner: ${{ steps.lowercase-owner.outputs.owner }}

    steps:
      - uses: actions/checkout@v6

      - name: Get commit short SHA
        id: short-sha
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "COMMIT_HASH=$SHA" >> $GITHUB_ENV
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner
        id: lowercase-owner
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "OWNER=$OWNER" >> $GITHUB_ENV
          echo "owner=$OWNER" >> $GITHUB_OUTPUT

      # Save current :latest as :pre-rebuild so we can roll back if the new build breaks VPS
      - name: Snapshot current images as pre-rebuild
        run: |
          for IMAGE in nexus-server nexus-client; do
            REF="ghcr.io/${{ env.OWNER }}/${IMAGE}"
            if docker pull "${REF}:latest"; then
              docker tag "${REF}:latest" "${REF}:pre-rebuild"
              docker push "${REF}:pre-rebuild"
            fi
          done

      - name: Server image metadata
        id: meta-server
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.OWNER }}/nexus-server
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ env.COMMIT_HASH }}

      - name: Client image metadata
        id: meta-client
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.OWNER }}/nexus-client
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ env.COMMIT_HASH }}

      # no-cache: true forces fresh apk upgrade; load: true builds locally for scan before push
      - name: Build server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta-server.outputs.tags }}
          no-cache: true

      - name: Scan server image
        id: scan-server
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.OWNER }}/nexus-server:sha-${{ env.COMMIT_HASH }}
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL

      - name: Build client image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: client/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta-client.outputs.tags }}
          build-args: COMMIT_HASH=${{ env.COMMIT_HASH }}
          no-cache: true

      - name: Scan client image
        id: scan-client
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.OWNER }}/nexus-client:sha-${{ env.COMMIT_HASH }}
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL

      # If any scan found HIGH/CRITICAL CVEs, hand off to the auto-patcher: it upgrades the
      # vulnerable Alpine packages (stable repos first, edge as fallback), rebuilds, re-scans,
      # and opens a patch PR. When a CVE cannot be resolved it opens a tracking issue with the
      # apk resolver conflict instead. The step exits 1 either way so the deploy job stays
      # blocked until a human acts. See scripts/auto-patch-cves.sh.
      - name: Auto-patch CVEs and open PR
        if: steps.scan-server.outcome == 'failure' || steps.scan-client.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_HASH: ${{ env.COMMIT_HASH }}
          IMAGE_SERVER: ghcr.io/${{ env.OWNER }}/nexus-server:sha-${{ env.COMMIT_HASH }}
          IMAGE_CLIENT: ghcr.io/${{ env.OWNER }}/nexus-client:sha-${{ env.COMMIT_HASH }}
          SCAN_SERVER_FAILED: ${{ steps.scan-server.outcome == 'failure' }}
          SCAN_CLIENT_FAILED: ${{ steps.scan-client.outcome == 'failure' }}
        run: bash scripts/auto-patch-cves.sh

      # Push only after both scans pass cleanly (no CVEs, no auto-patch ran)
      - name: Push server image
        if: steps.scan-server.outcome == 'success' && steps.scan-client.outcome == 'success'
        run: |
          docker push ghcr.io/${{ env.OWNER }}/nexus-server:sha-${{ env.COMMIT_HASH }}
          docker push ghcr.io/${{ env.OWNER }}/nexus-server:latest

      - name: Push client image
        if: steps.scan-server.outcome == 'success' && steps.scan-client.outcome == 'success'
        run: |
          docker push ghcr.io/${{ env.OWNER }}/nexus-client:sha-${{ env.COMMIT_HASH }}
          docker push ghcr.io/${{ env.OWNER }}/nexus-client:latest

  deploy:
    name: Deploy to VPS
    needs: rebuild-push
    runs-on: ubuntu-latest
    permissions:
      # The job forwards this token to the VPS so the deploy fetch is
      # authenticated. Pin it read-only here rather than inheriting the
      # repository default, which a later settings change could widen.
      contents: read
    # Same bound as deploy.yml's SSH job, and for the same reason — see the
    # comment there. Only this job is bounded: the rebuild-push job above runs
    # a no-cache image build and legitimately takes far longer.
    timeout-minutes: 15
    steps:
      # This job is separate from rebuild-push, so it needs its own checkout —
      # only to make the local composite action below available. No `ref:`:
      # this workflow is scheduled or dispatched, so the default is correct.
      - uses: actions/checkout@v6

      # Keeps the third-party release download off the deploy path — see
      # deploy.yml for the full rationale.
      - name: Preseed the SSH client
        id: ssh-client
        uses: ./.github/actions/preseed-ssh-client
        with:
          host_key: ${{ secrets.VPS_HOST_KEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # See deploy.yml — this job forwards the same secret set through
          # `envs` below.
          fingerprint: ${{ steps.ssh-client.outputs.fingerprint }}
          envs: DEPLOY_SHA,OWNER,GRAFANA_ADMIN_PASSWORD,GRAFANA_ROOT_URL,ALERT_WEBHOOK_URL,JWT_PRIVATE_KEY,JWT_PUBLIC_KEY,DB_PASSWORD,GOOGLE_CLIENT_SECRET,FACEBOOK_CLIENT_SECRET,VK_CLIENT_SECRET,ADMIN_PASSWORD,MFA_ENCRYPTION_KEY,MFA_REQUIRED_FOR_ADMINS,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,SMTP_FROM,TURNSTILE_SITE_KEY,TURNSTILE_SECRET_KEY,PADDLE_API_KEY,PADDLE_WEBHOOK_SECRET,YOOKASSA_SHOP_ID,YOOKASSA_SECRET_KEY,GH_FETCH_TOKEN
          script: |
            set -euo pipefail
            cd /home/deploy/nexus

            # The repository is public and this clone has no credential
            # helper, so the fetch used to go out anonymous. On 2026-08-31,
            # for a window of about 15 minutes, GitHub answered `GET
            # /info/refs` from this host with 200 and answered the anonymous
            # `POST /git-upload-pack` with 401 and `WWW-Authenticate: Basic`.
            # Git handles a 401 by asking a credential helper and repeating the
            # POST - with none configured it falls back to prompting, and a
            # deploy has no TTY, so it dies on `fatal: could not read
            # Username`. That killed all three attempts of run 33383448411.
            #
            # Observed on this host with GIT_CURL_VERBOSE, at 10:52 UTC. Every
            # anonymous sample taken after the window answered 200 (curl 40/40,
            # git 40/40), so the fault was an episode, not a steady state, and
            # the host configuration had not changed since February.
            #
            # Authenticating removes the dependency on anonymous service
            # altogether. The retry covers a transient failure only; 15 seconds
            # of retrying would not have outlasted that window. The helper
            # reads the token from the environment at the moment git runs it,
            # so the value never reaches the process table, and the job
            # forwards a read-only token that expires with the job.
            git_authed() {
              GIT_TERMINAL_PROMPT=0 git \
                -c credential.helper= \
                -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_FETCH_TOKEN"; }; f' \
                "$@"
            }

            git_authed_retry() {
              GIT_ATTEMPT=1
              while :; do
                if git_authed "$@"; then
                  return 0
                fi
                if [ "$GIT_ATTEMPT" -ge 3 ]; then
                  echo "ERROR: git $* failed on all $GIT_ATTEMPT attempts" >&2
                  return 1
                fi
                echo "git $* failed (attempt $GIT_ATTEMPT) - retrying"
                sleep $((GIT_ATTEMPT * 5))
                GIT_ATTEMPT=$((GIT_ATTEMPT + 1))
              done
            }

            # Clean up docker-compose.yml if an earlier deploy or rollback left
            # it checked out at another commit
            git checkout HEAD -- docker-compose.yml 2>/dev/null || true
            git_authed_retry pull --ff-only

            # Pin the compose file to the commit the images were rebuilt from —
            # master can move between the rebuild and this deploy. See deploy.yml.
            git checkout "${DEPLOY_SHA}" -- docker-compose.yml

            PREV_SHA=""
            if [ -f .deployed-sha ]; then
              PREV_SHA=$(cat .deployed-sha)
            fi

            echo "Redeploying sha-${DEPLOY_SHA} with fresh OS packages (previous: ${PREV_SHA:-none})"

            # Refuse to deploy with an empty Grafana admin password. The compose
            # file defaults to "admin" for local-dev convenience, so an empty
            # secret here would silently ship admin/admin on the public Grafana.
            # Fail before touching any container — the running stack is untouched.
            if [ -z "${GRAFANA_ADMIN_PASSWORD:-}" ]; then
              echo "ERROR: GRAFANA_ADMIN_PASSWORD is empty — refusing to deploy with the default 'admin' password. Set the GRAFANA_ADMIN_PASSWORD repository secret." >&2
              exit 1
            fi

            # Refuse to deploy without an alert webhook. Grafana provisions its
            # contact point from this URL and exits during startup when it is
            # empty, so an unset secret would take the whole monitoring stack
            # down — and a compose default would leave alerts silently undelivered.
            if [ -z "${ALERT_WEBHOOK_URL:-}" ]; then
              echo "ERROR: ALERT_WEBHOOK_URL is empty — Grafana would fail to provision its alert contact point and exit. Set the ALERT_WEBHOOK_URL repository secret." >&2
              exit 1
            fi

            # Sync managed credentials (SMTP, JWT keys, DB_PASSWORD, OAuth, etc.)
            # from GitHub Secrets into server/.env (and root .env for DB_PASSWORD).
            # Source of truth is the secrets, so a from-scratch rebuild restores
            # them; each key is written only when its secret is non-empty, so this
            # is a safe no-op for any secret not yet populated. See the script.
            bash scripts/sync-prod-env.sh

            docker compose pull
            docker compose up -d --remove-orphans

            # Require ALL services with healthcheck to be healthy
            EXPECTED=$(docker compose config 2>/dev/null | grep -c 'healthcheck:' || true)
            if [ "$EXPECTED" -lt 1 ]; then EXPECTED=4; fi
            echo "Expecting $EXPECTED services with healthcheck"
            TIMEOUT=120
            ELAPSED=0
            HEALTHY=0
            while [ $ELAPSED -lt $TIMEOUT ]; do
              if docker compose ps --format '{{.Health}}' | grep -q 'unhealthy'; then
                sleep 5
                ELAPSED=$((ELAPSED + 5))
                continue
              fi
              HEALTHY=$(docker compose ps --format '{{.Health}}' | grep -c 'healthy' || true)
              if [ "$HEALTHY" -ge "$EXPECTED" ]; then
                break
              fi
              sleep 5
              ELAPSED=$((ELAPSED + 5))
            done

            if [ "$HEALTHY" -ge "$EXPECTED" ]; then
              echo "Redeploy successful — sha-${DEPLOY_SHA}"
              cp -f .deployed-sha .prev-deployed-sha 2>/dev/null || true
              echo "$DEPLOY_SHA" > .deployed-sha
              docker image prune -f
              exit 0
            fi

            # Health check failed — roll back to pre-rebuild images
            echo "Health check failed after ${TIMEOUT}s — rolling back to pre-rebuild images"

            docker pull "ghcr.io/${OWNER}/nexus-server:pre-rebuild" || true
            docker pull "ghcr.io/${OWNER}/nexus-client:pre-rebuild" || true

            if docker image inspect "ghcr.io/${OWNER}/nexus-server:pre-rebuild" > /dev/null 2>&1 && \
               docker image inspect "ghcr.io/${OWNER}/nexus-client:pre-rebuild" > /dev/null 2>&1; then
              docker tag "ghcr.io/${OWNER}/nexus-server:pre-rebuild" "ghcr.io/${OWNER}/nexus-server:latest"
              docker tag "ghcr.io/${OWNER}/nexus-client:pre-rebuild" "ghcr.io/${OWNER}/nexus-client:latest"
              docker compose down
              docker compose up -d

              ELAPSED=0
              ROLLBACK_HEALTHY=0
              while [ $ELAPSED -lt $TIMEOUT ]; do
                if docker compose ps --format '{{.Health}}' | grep -q 'unhealthy'; then
                  sleep 5
                  ELAPSED=$((ELAPSED + 5))
                  continue
                fi
                ROLLBACK_HEALTHY=$(docker compose ps --format '{{.Health}}' | grep -c 'healthy' || true)
                if [ "$ROLLBACK_HEALTHY" -ge "$EXPECTED" ]; then
                  break
                fi
                sleep 5
                ELAPSED=$((ELAPSED + 5))
              done

              if [ "$ROLLBACK_HEALTHY" -ge "$EXPECTED" ]; then
                echo "Rolled back to pre-rebuild images successfully"
              else
                echo "Rollback health check also failed — manual intervention required"
              fi
            else
              echo "Pre-rebuild images not available — manual intervention required"
            fi

            exit 1
        env:
          DEPLOY_SHA: ${{ needs.rebuild-push.outputs.sha }}
          OWNER: ${{ needs.rebuild-push.outputs.owner }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          GRAFANA_ROOT_URL: ${{ secrets.GRAFANA_ROOT_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FACEBOOK_CLIENT_SECRET: ${{ secrets.FACEBOOK_CLIENT_SECRET }}
          VK_CLIENT_SECRET: ${{ secrets.VK_CLIENT_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          MFA_ENCRYPTION_KEY: ${{ secrets.MFA_ENCRYPTION_KEY }}
          MFA_REQUIRED_FOR_ADMINS: ${{ secrets.MFA_REQUIRED_FOR_ADMINS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
          PADDLE_WEBHOOK_SECRET: ${{ secrets.PADDLE_WEBHOOK_SECRET }}
          YOOKASSA_SHOP_ID: ${{ secrets.YOOKASSA_SHOP_ID }}
          YOOKASSA_SECRET_KEY: ${{ secrets.YOOKASSA_SECRET_KEY }}
          GH_FETCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
