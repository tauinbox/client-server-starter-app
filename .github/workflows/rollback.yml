name: Rollback

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Short commit SHA to roll back to (e.g. a1b2c3d). Leave empty to roll back to the previous version automatically.'
        required: false
        type: string

concurrency:
  group: deploy-production
  # The only workflow in this group that preempts instead of queueing. The
  # group exists so that two workflows never run `docker compose` on the VPS at
  # once, but with `cancel-in-progress: false` here a wedged deploy also held
  # the rollback that exists to undo it: on 2026-08-13 a deploy occupied the
  # group for 52 min, and a rollback dispatched in that window would have sat
  # pending for the whole outage. An operator asking for a rollback is asking
  # for the in-flight deploy to stop, so it cancels that deploy and takes the
  # group. A stack left half-recreated by the cancellation is then repaired by
  # this workflow's own `docker compose up -d --force-recreate`.
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve Target Version
    runs-on: ubuntu-latest
    # Reads one file over SSH. `ConnectTimeout=10` bounds the connect only, not
    # a session that stalls after it is established.
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve target version
        id: resolve
        run: |
          VERSION="${{ inputs.version }}"
          if [ -n "$VERSION" ]; then
            if ! echo "$VERSION" | grep -qE '^[0-9a-f]{7,40}$'; then
              echo "ERROR: version must be a 7–40 character lowercase hex commit SHA"
              exit 1
            fi
            echo "Using provided version: $VERSION"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "No version provided — fetching previous from VPS"
            # A runner starts with an empty known_hosts, so without this the
            # client would take whatever key answers and hand the deploy key to
            # it. The other three SSH jobs get the same protection from the
            # fingerprint derived in the preseed action; this job does not check
            # the repository out, so it seeds known_hosts itself.
            if [ -z "${VPS_HOST_KEY:-}" ]; then
              echo "ERROR: VPS_HOST_KEY is empty — refusing to connect without verifying the host. Set the repository secret to the output of 'ssh-keyscan -t ecdsa <host>', checked against /etc/ssh/ssh_host_ecdsa_key.pub on the host itself." >&2
              exit 1
            fi
            mkdir -p ~/.ssh
            printf '%s' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            trap 'rm -f ~/.ssh/deploy_key' EXIT
            # The secret holds the line as `ssh-keyscan` printed it; the host
            # field is rewritten so the entry matches whatever VPS_HOST is,
            # scan host and connect host being spelled differently otherwise.
            HOST_KEY_FIELDS=$(printf '%s\n' "$VPS_HOST_KEY" | grep -v '^[[:space:]]*#' | grep -v '^[[:space:]]*$' | head -1 | cut -d ' ' -f2-)
            if [ -z "$HOST_KEY_FIELDS" ]; then
              echo "ERROR: VPS_HOST_KEY holds no key line." >&2
              exit 1
            fi
            printf '%s %s\n' "$VPS_HOST" "$HOST_KEY_FIELDS" > ~/.ssh/known_hosts
            # Pin the algorithm to the pinned key's own, taken from the line
            # rather than written out again. The host offers three host keys
            # and each client picks a different one by default, which is how
            # the first run of this change passed here and failed in the other
            # three jobs: OpenSSH negotiated ed25519, Go's client ECDSA.
            HOST_KEY_ALGO=$(printf '%s' "$HOST_KEY_FIELDS" | cut -d ' ' -f1)
            PREV=$(ssh -o HostKeyAlgorithms="$HOST_KEY_ALGO" \
              -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
              -i ~/.ssh/deploy_key \
              "$VPS_USER@$VPS_HOST" \
              'cat /home/deploy/nexus/.prev-deployed-sha 2>/dev/null || echo ""')
            rm -f ~/.ssh/deploy_key
            if [ -z "$PREV" ]; then
              echo "ERROR: No previous version found on VPS. Deploy at least twice before using auto-rollback."
              exit 1
            fi
            echo "Auto-resolved to previous version: $PREV"
            echo "version=$PREV" >> $GITHUB_OUTPUT
          fi
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}

  retag:
    name: Retag sha-${{ needs.resolve.outputs.version }} as latest
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      owner: ${{ steps.lowercase-owner.outputs.owner }}
    steps:
      - name: Lowercase repository owner
        id: lowercase-owner
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "owner=$OWNER" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull SHA-tagged images from registry
        run: |
          OWNER="${{ steps.lowercase-owner.outputs.owner }}"
          VERSION="${{ needs.resolve.outputs.version }}"
          docker pull "ghcr.io/${OWNER}/nexus-server:sha-${VERSION}"
          docker pull "ghcr.io/${OWNER}/nexus-client:sha-${VERSION}"

      - name: Retag as latest and push to registry
        run: |
          OWNER="${{ steps.lowercase-owner.outputs.owner }}"
          VERSION="${{ needs.resolve.outputs.version }}"
          docker tag "ghcr.io/${OWNER}/nexus-server:sha-${VERSION}" "ghcr.io/${OWNER}/nexus-server:latest"
          docker tag "ghcr.io/${OWNER}/nexus-client:sha-${VERSION}" "ghcr.io/${OWNER}/nexus-client:latest"
          docker push "ghcr.io/${OWNER}/nexus-server:latest"
          docker push "ghcr.io/${OWNER}/nexus-client:latest"

  deploy:
    name: Deploy Rolled-Back Version to VPS
    needs: [resolve, retag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Same bound as the deploy job it undoes, and for the same reason — see the
    # comment in deploy.yml.
    timeout-minutes: 15
    steps:
      # Checked out only to make the local composite action below available.
      # No `ref:` — this workflow is dispatched, so the default is correct.
      - uses: actions/checkout@v6

      # The action downloads its worker binary from a GitHub release on every
      # run; a 503 there aborts the job before it connects. This is the site
      # where that matters most — an emergency rollback failing on the same
      # outage as the deploy it undoes. See deploy.yml for the full rationale.
      - name: Preseed the SSH client
        id: ssh-client
        uses: ./.github/actions/preseed-ssh-client
        with:
          host_key: ${{ secrets.VPS_HOST_KEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # See deploy.yml. An emergency rollback is exactly when nobody is
          # going to notice that the far side answered with the wrong key.
          fingerprint: ${{ steps.ssh-client.outputs.fingerprint }}
          envs: VERSION,GH_FETCH_TOKEN
          script: |
            set -euo pipefail
            cd /home/deploy/nexus

            # The repository is public and this clone has no credential
            # helper, so the fetch used to go out anonymous. On 2026-08-31,
            # for a window of about 15 minutes, GitHub answered `GET
            # /info/refs` from this host with 200 and answered the anonymous
            # `POST /git-upload-pack` with 401 and `WWW-Authenticate: Basic`.
            # Git handles a 401 by asking a credential helper and repeating the
            # POST - with none configured it falls back to prompting, and a
            # deploy has no TTY, so it dies on `fatal: could not read
            # Username`. That killed all three attempts of run 33383448411.
            #
            # Observed on this host with GIT_CURL_VERBOSE, at 10:52 UTC. Every
            # anonymous sample taken after the window answered 200 (curl 40/40,
            # git 40/40), so the fault was an episode, not a steady state, and
            # the host configuration had not changed since February.
            #
            # Authenticating removes the dependency on anonymous service
            # altogether. The retry covers a transient failure only; 15 seconds
            # of retrying would not have outlasted that window. The helper
            # reads the token from the environment at the moment git runs it,
            # so the value never reaches the process table, and the job
            # forwards a read-only token that expires with the job.
            git_authed() {
              GIT_TERMINAL_PROMPT=0 git \
                -c credential.helper= \
                -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_FETCH_TOKEN"; }; f' \
                "$@"
            }

            git_authed_retry() {
              GIT_ATTEMPT=1
              while :; do
                if git_authed "$@"; then
                  return 0
                fi
                if [ "$GIT_ATTEMPT" -ge 3 ]; then
                  echo "ERROR: git $* failed on all $GIT_ATTEMPT attempts" >&2
                  return 1
                fi
                echo "git $* failed (attempt $GIT_ATTEMPT) - retrying"
                sleep $((GIT_ATTEMPT * 5))
                GIT_ATTEMPT=$((GIT_ATTEMPT + 1))
              done
            }

            echo "Rolling back to sha-${VERSION}..."

            # Clean up docker-compose.yml if a previous rollback left it modified,
            # then restore the version matching the rollback target
            git checkout HEAD -- docker-compose.yml 2>/dev/null || true
            git_authed_retry fetch --quiet origin
            git checkout "$VERSION" -- docker-compose.yml

            # :latest in the registry now points to the target SHA (retagged above)
            docker compose pull

            # force-recreate ensures containers restart even if compose detects no tag change
            docker compose up -d --force-recreate --remove-orphans

            # Health check with timeout — require ALL services with healthcheck to be healthy
            EXPECTED=$(docker compose config 2>/dev/null | grep -c 'healthcheck:' || true)
            if [ "$EXPECTED" -lt 1 ]; then EXPECTED=4; fi
            echo "Expecting $EXPECTED services with healthcheck"
            TIMEOUT=120
            ELAPSED=0
            HEALTHY=0
            while [ $ELAPSED -lt $TIMEOUT ]; do
              if docker compose ps --format '{{.Health}}' | grep -q 'unhealthy'; then
                sleep 5
                ELAPSED=$((ELAPSED + 5))
                continue
              fi
              HEALTHY=$(docker compose ps --format '{{.Health}}' | grep -c 'healthy' || true)
              if [ "$HEALTHY" -ge "$EXPECTED" ]; then
                break
              fi
              sleep 5
              ELAPSED=$((ELAPSED + 5))
            done

            if [ "$HEALTHY" -ge "$EXPECTED" ]; then
              echo "Rollback to sha-${VERSION} successful"
              cp -f .deployed-sha .prev-deployed-sha 2>/dev/null || true
              echo "${VERSION}" > .deployed-sha
              docker image prune -f
              exit 0
            fi

            echo "Rollback health check failed — check container logs with: docker compose logs"
            exit 1
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          GH_FETCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
