name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [master]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-push:
    name: Build & Push Images
    # The `branches: [master]` filter above matches the TRIGGERING run's head
    # branch, and CI also runs on pull_request. A fork ships with a branch
    # called `master`, so a pull request opened from it produced a CI run that
    # satisfied the filter, and this job then checked out `head_sha` — the
    # fork's commit — built it and deployed it to production with every secret
    # in `envs:` below. Nothing else gated it: the repository is public and has
    # no environment with a manual approval. So pin all three axes of the
    # trigger, not just its conclusion: the source event, the source branch and
    # the source repository.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.short-sha.outputs.sha }}
      owner: ${{ steps.lowercase-owner.outputs.owner }}
      server_image: ${{ steps.meta-server.outputs.tags }}
      client_image: ${{ steps.meta-client.outputs.tags }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Get commit short SHA
        id: short-sha
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "COMMIT_HASH=$SHA" >> $GITHUB_ENV
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner
        id: lowercase-owner
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "OWNER=$OWNER" >> $GITHUB_ENV
          echo "owner=$OWNER" >> $GITHUB_OUTPUT

      - name: Server image metadata
        id: meta-server
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.OWNER }}/nexus-server
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ env.COMMIT_HASH }}

      - name: Client image metadata
        id: meta-client
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.OWNER }}/nexus-client
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ env.COMMIT_HASH }}

      # Build locally first, scan, then push — prevents pushing vulnerable images to GHCR
      # ignore-error on cache-to: the GHA cache backend intermittently fails the
      # export (e.g. "error writing layer blob: not_found"). The cache is an
      # optimization, so a failed export must not abort a production deploy of an
      # already-built, scanned image.
      - name: Build server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta-server.outputs.tags }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max,ignore-error=true

      # Block deploy on CRITICAL CVEs; HIGH is enforced zero by the weekly Scheduled Rebuild
      # (which uses no-cache to avoid stale apk layers).
      - name: Scan server image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.OWNER }}/nexus-server:sha-${{ env.COMMIT_HASH }}
          format: table
          exit-code: '1'
          severity: CRITICAL

      - name: Build client image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: client/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta-client.outputs.tags }}
          build-args: COMMIT_HASH=${{ env.COMMIT_HASH }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,scope=client,mode=max,ignore-error=true

      # Block deploy on CRITICAL CVEs — see note on server scan above
      - name: Scan client image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.OWNER }}/nexus-client:sha-${{ env.COMMIT_HASH }}
          format: table
          exit-code: '1'
          severity: CRITICAL

      # Push only after both scans pass
      - name: Push server image
        run: |
          docker push ghcr.io/${{ env.OWNER }}/nexus-server:sha-${{ env.COMMIT_HASH }}
          docker push ghcr.io/${{ env.OWNER }}/nexus-server:latest

      - name: Push client image
        run: |
          docker push ghcr.io/${{ env.OWNER }}/nexus-client:sha-${{ env.COMMIT_HASH }}
          docker push ghcr.io/${{ env.OWNER }}/nexus-client:latest

  deploy:
    name: Deploy to VPS
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      # The job forwards this token to the VPS so the deploy fetch is
      # authenticated. Pin it read-only here rather than inheriting the
      # repository default, which a later settings change could widen.
      contents: read
    # A healthy run of this job takes about a minute (24-63 s across the last
    # nine successful deploys). On 2026-08-13 the VPS ran out of memory during
    # the image pull and stopped scheduling userspace, and this job hung for
    # 52 min until it was cancelled by hand — the action's own `timeout` (30 s
    # connect) and `command_timeout` (10 m) were both in force and neither
    # bounded it. Only a job-level limit is enforced by the runner rather than
    # by the SSH client, so that is what bounds it here. 15 min still clears
    # the script's own worst case: two image pulls, 120 s of health checks,
    # then the rollback branch pulling two more and checking for another 120 s.
    timeout-minutes: 15
    steps:
      # Checked out only to make the local composite action below available;
      # nothing else in this job reads the workspace.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # appleboy/ssh-action fetches its worker binary from a GitHub release on
      # every run and aborts the deploy when that URL is unavailable, which is
      # how run 31621702560 failed on six consecutive 503s. Installing the
      # binary from the cache first makes the action skip that download.
      - name: Preseed the SSH client
        id: ssh-client
        uses: ./.github/actions/preseed-ssh-client
        with:
          host_key: ${{ secrets.VPS_HOST_KEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Without this the client accepts whatever key answers on the far
          # side, so a redirected connection collects the deploy key and every
          # secret forwarded through `envs` below.
          fingerprint: ${{ steps.ssh-client.outputs.fingerprint }}
          envs: DEPLOY_SHA,OWNER,GRAFANA_ADMIN_PASSWORD,GRAFANA_ROOT_URL,ALERT_WEBHOOK_URL,JWT_PRIVATE_KEY,JWT_PUBLIC_KEY,DB_PASSWORD,GOOGLE_CLIENT_SECRET,FACEBOOK_CLIENT_SECRET,VK_CLIENT_SECRET,ADMIN_PASSWORD,MFA_ENCRYPTION_KEY,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,SMTP_FROM,TURNSTILE_SITE_KEY,TURNSTILE_SECRET_KEY,PADDLE_API_KEY,PADDLE_WEBHOOK_SECRET,YOOKASSA_SHOP_ID,YOOKASSA_SECRET_KEY,GH_FETCH_TOKEN
          script: |
            set -euo pipefail
            cd /home/deploy/nexus

            # The repository is public and this clone has no credential
            # helper, so the fetch used to go out anonymous. On 2026-08-31,
            # for a window of about 15 minutes, GitHub answered `GET
            # /info/refs` from this host with 200 and answered the anonymous
            # `POST /git-upload-pack` with 401 and `WWW-Authenticate: Basic`.
            # Git handles a 401 by asking a credential helper and repeating the
            # POST - with none configured it falls back to prompting, and a
            # deploy has no TTY, so it dies on `fatal: could not read
            # Username`. That killed all three attempts of run 33383448411.
            #
            # Observed on this host with GIT_CURL_VERBOSE, at 10:52 UTC. Every
            # anonymous sample taken after the window answered 200 (curl 40/40,
            # git 40/40), so the fault was an episode, not a steady state, and
            # the host configuration had not changed since February.
            #
            # Authenticating removes the dependency on anonymous service
            # altogether. The retry covers a transient failure only; 15 seconds
            # of retrying would not have outlasted that window. The helper
            # reads the token from the environment at the moment git runs it,
            # so the value never reaches the process table, and the job
            # forwards a read-only token that expires with the job.
            git_authed() {
              GIT_TERMINAL_PROMPT=0 git \
                -c credential.helper= \
                -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_FETCH_TOKEN"; }; f' \
                "$@"
            }

            git_authed_retry() {
              GIT_ATTEMPT=1
              while :; do
                if git_authed "$@"; then
                  return 0
                fi
                if [ "$GIT_ATTEMPT" -ge 3 ]; then
                  echo "ERROR: git $* failed on all $GIT_ATTEMPT attempts" >&2
                  return 1
                fi
                echo "git $* failed (attempt $GIT_ATTEMPT) - retrying"
                sleep $((GIT_ATTEMPT * 5))
                GIT_ATTEMPT=$((GIT_ATTEMPT + 1))
              done
            }

            # Clean up docker-compose.yml if an earlier deploy or rollback left
            # it checked out at another commit
            git checkout HEAD -- docker-compose.yml 2>/dev/null || true
            git_authed_retry pull --ff-only

            # Pin the compose file to the commit whose images this run built.
            # The pull above lands the tip of master, which may already carry a
            # later merge, so without this a deploy can compose file N+1 with
            # images N. Same shape as the rollback path, which checks the file
            # out at its own target SHA. Failing here aborts before any
            # container is touched.
            git checkout "${DEPLOY_SHA}" -- docker-compose.yml

            # Read the previously successful SHA (empty on first deploy)
            PREV_SHA=""
            if [ -f .deployed-sha ]; then
              PREV_SHA=$(cat .deployed-sha)
            fi

            echo "Deploying sha-${DEPLOY_SHA} (previous: ${PREV_SHA:-none})"

            # Refuse to deploy with an empty Grafana admin password. The compose
            # file defaults to "admin" for local-dev convenience, so an empty
            # secret here would silently ship admin/admin on the public Grafana.
            # Fail before touching any container — the running stack is untouched.
            if [ -z "${GRAFANA_ADMIN_PASSWORD:-}" ]; then
              echo "ERROR: GRAFANA_ADMIN_PASSWORD is empty — refusing to deploy with the default 'admin' password. Set the GRAFANA_ADMIN_PASSWORD repository secret." >&2
              exit 1
            fi

            # Refuse to deploy without an alert webhook. Grafana provisions its
            # contact point from this URL and exits during startup when it is
            # empty, so an unset secret would take the whole monitoring stack
            # down — and a compose default would leave alerts silently undelivered.
            if [ -z "${ALERT_WEBHOOK_URL:-}" ]; then
              echo "ERROR: ALERT_WEBHOOK_URL is empty — Grafana would fail to provision its alert contact point and exit. Set the ALERT_WEBHOOK_URL repository secret." >&2
              exit 1
            fi

            # Sync managed credentials (SMTP, JWT keys, DB_PASSWORD, OAuth, etc.)
            # from GitHub Secrets into server/.env (and root .env for DB_PASSWORD).
            # Source of truth is the secrets, so a from-scratch rebuild restores
            # them; each key is written only when its secret is non-empty, so this
            # is a safe no-op for any secret not yet populated. See the script.
            bash scripts/sync-prod-env.sh

            docker compose pull
            docker compose up -d --remove-orphans

            # Health check with timeout — require ALL services with healthcheck to be healthy
            echo "Waiting for services to become healthy..."
            EXPECTED=$(docker compose config 2>/dev/null | grep -c 'healthcheck:' || true)
            if [ "$EXPECTED" -lt 1 ]; then EXPECTED=4; fi
            echo "Expecting $EXPECTED services with healthcheck"
            TIMEOUT=120
            ELAPSED=0
            HEALTHY=0
            while [ $ELAPSED -lt $TIMEOUT ]; do
              if docker compose ps --format '{{.Health}}' | grep -q 'unhealthy'; then
                sleep 5
                ELAPSED=$((ELAPSED + 5))
                continue
              fi
              HEALTHY=$(docker compose ps --format '{{.Health}}' | grep -c 'healthy' || true)
              if [ "$HEALTHY" -ge "$EXPECTED" ]; then
                break
              fi
              sleep 5
              ELAPSED=$((ELAPSED + 5))
            done

            if [ "$HEALTHY" -ge "$EXPECTED" ]; then
              echo "Deploy successful — sha-${DEPLOY_SHA}"
              cp -f .deployed-sha .prev-deployed-sha 2>/dev/null || true
              echo "$DEPLOY_SHA" > .deployed-sha
              docker image prune -f
              exit 0
            fi

            # Health check failed — attempt rollback
            echo "Health check failed after ${TIMEOUT}s"

            if [ -z "$PREV_SHA" ]; then
              echo "No previous version on record — bringing services down"
              docker compose down
              exit 1
            fi

            echo "Rolling back to sha-${PREV_SHA}"
            docker pull "ghcr.io/${OWNER}/nexus-server:sha-${PREV_SHA}"
            docker pull "ghcr.io/${OWNER}/nexus-client:sha-${PREV_SHA}"
            docker tag "ghcr.io/${OWNER}/nexus-server:sha-${PREV_SHA}" "ghcr.io/${OWNER}/nexus-server:latest"
            docker tag "ghcr.io/${OWNER}/nexus-client:sha-${PREV_SHA}" "ghcr.io/${OWNER}/nexus-client:latest"

            # Restore docker-compose.yml to match the rollback target SHA
            git_authed_retry fetch --quiet origin
            git checkout "${PREV_SHA}" -- docker-compose.yml

            docker compose down
            docker compose up -d

            # Verify rollback health
            ELAPSED=0
            ROLLBACK_HEALTHY=0
            while [ $ELAPSED -lt $TIMEOUT ]; do
              if docker compose ps --format '{{.Health}}' | grep -q 'unhealthy'; then
                sleep 5
                ELAPSED=$((ELAPSED + 5))
                continue
              fi
              ROLLBACK_HEALTHY=$(docker compose ps --format '{{.Health}}' | grep -c 'healthy' || true)
              if [ "$ROLLBACK_HEALTHY" -ge "$EXPECTED" ]; then
                break
              fi
              sleep 5
              ELAPSED=$((ELAPSED + 5))
            done

            if [ "$ROLLBACK_HEALTHY" -ge "$EXPECTED" ]; then
              echo "Rolled back to sha-${PREV_SHA} successfully"
            else
              echo "Rollback health check also failed — manual intervention required"
            fi

            exit 1
        env:
          DEPLOY_SHA: ${{ needs.build-push.outputs.sha }}
          OWNER: ${{ needs.build-push.outputs.owner }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          GRAFANA_ROOT_URL: ${{ secrets.GRAFANA_ROOT_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FACEBOOK_CLIENT_SECRET: ${{ secrets.FACEBOOK_CLIENT_SECRET }}
          VK_CLIENT_SECRET: ${{ secrets.VK_CLIENT_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          MFA_ENCRYPTION_KEY: ${{ secrets.MFA_ENCRYPTION_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
          PADDLE_WEBHOOK_SECRET: ${{ secrets.PADDLE_WEBHOOK_SECRET }}
          YOOKASSA_SHOP_ID: ${{ secrets.YOOKASSA_SHOP_ID }}
          YOOKASSA_SECRET_KEY: ${{ secrets.YOOKASSA_SECRET_KEY }}
          GH_FETCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
