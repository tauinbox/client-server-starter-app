name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [master]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-push:
    name: Build & Push Images
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.short-sha.outputs.sha }}
      owner: ${{ steps.lowercase-owner.outputs.owner }}
      server_image: ${{ steps.meta-server.outputs.tags }}
      client_image: ${{ steps.meta-client.outputs.tags }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Get commit short SHA
        id: short-sha
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "COMMIT_HASH=$SHA" >> $GITHUB_ENV
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner
        id: lowercase-owner
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "OWNER=$OWNER" >> $GITHUB_ENV
          echo "owner=$OWNER" >> $GITHUB_OUTPUT

      - name: Server image metadata
        id: meta-server
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.OWNER }}/nexus-server
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ env.COMMIT_HASH }}

      - name: Client image metadata
        id: meta-client
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.OWNER }}/nexus-client
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ env.COMMIT_HASH }}

      # Build locally first, scan, then push — prevents pushing vulnerable images to GHCR
      # ignore-error on cache-to: the GHA cache backend intermittently fails the
      # export (e.g. "error writing layer blob: not_found"). The cache is an
      # optimization, so a failed export must not abort a production deploy of an
      # already-built, scanned image.
      - name: Build server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta-server.outputs.tags }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max,ignore-error=true

      # Block deploy on CRITICAL CVEs; HIGH is enforced zero by the weekly Scheduled Rebuild
      # (which uses no-cache to avoid stale apk layers).
      - name: Scan server image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.OWNER }}/nexus-server:sha-${{ env.COMMIT_HASH }}
          format: table
          exit-code: '1'
          severity: CRITICAL

      - name: Build client image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: client/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta-client.outputs.tags }}
          build-args: COMMIT_HASH=${{ env.COMMIT_HASH }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,scope=client,mode=max,ignore-error=true

      # Block deploy on CRITICAL CVEs — see note on server scan above
      - name: Scan client image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.OWNER }}/nexus-client:sha-${{ env.COMMIT_HASH }}
          format: table
          exit-code: '1'
          severity: CRITICAL

      # Push only after both scans pass
      - name: Push server image
        run: |
          docker push ghcr.io/${{ env.OWNER }}/nexus-server:sha-${{ env.COMMIT_HASH }}
          docker push ghcr.io/${{ env.OWNER }}/nexus-server:latest

      - name: Push client image
        run: |
          docker push ghcr.io/${{ env.OWNER }}/nexus-client:sha-${{ env.COMMIT_HASH }}
          docker push ghcr.io/${{ env.OWNER }}/nexus-client:latest

  deploy:
    name: Deploy to VPS
    needs: build-push
    runs-on: ubuntu-latest
    # A healthy run of this job takes about a minute (24-63 s across the last
    # nine successful deploys). On 2026-08-13 the VPS ran out of memory during
    # the image pull and stopped scheduling userspace, and this job hung for
    # 52 min until it was cancelled by hand — the action's own `timeout` (30 s
    # connect) and `command_timeout` (10 m) were both in force and neither
    # bounded it. Only a job-level limit is enforced by the runner rather than
    # by the SSH client, so that is what bounds it here. 15 min still clears
    # the script's own worst case: two image pulls, 120 s of health checks,
    # then the rollback branch pulling two more and checking for another 120 s.
    timeout-minutes: 15
    steps:
      # Checked out only to make the local composite action below available;
      # nothing else in this job reads the workspace.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # appleboy/ssh-action fetches its worker binary from a GitHub release on
      # every run and aborts the deploy when that URL is unavailable, which is
      # how run 31621702560 failed on six consecutive 503s. Installing the
      # binary from the cache first makes the action skip that download.
      - name: Preseed the SSH client
        uses: ./.github/actions/preseed-ssh-client

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_SHA,OWNER,GRAFANA_ADMIN_PASSWORD,GRAFANA_ROOT_URL,ALERT_WEBHOOK_URL,JWT_PRIVATE_KEY,JWT_PUBLIC_KEY,DB_PASSWORD,GOOGLE_CLIENT_SECRET,FACEBOOK_CLIENT_SECRET,VK_CLIENT_SECRET,ADMIN_PASSWORD,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,SMTP_FROM,TURNSTILE_SITE_KEY,TURNSTILE_SECRET_KEY,PADDLE_API_KEY,PADDLE_WEBHOOK_SECRET,YOOKASSA_SHOP_ID,YOOKASSA_SECRET_KEY
          script: |
            set -euo pipefail
            cd /home/deploy/nexus
            # Clean up docker-compose.yml if a previous rollback left it modified
            git checkout HEAD -- docker-compose.yml 2>/dev/null || true
            git pull --ff-only

            # Read the previously successful SHA (empty on first deploy)
            PREV_SHA=""
            if [ -f .deployed-sha ]; then
              PREV_SHA=$(cat .deployed-sha)
            fi

            echo "Deploying sha-${DEPLOY_SHA} (previous: ${PREV_SHA:-none})"

            # Refuse to deploy with an empty Grafana admin password. The compose
            # file defaults to "admin" for local-dev convenience, so an empty
            # secret here would silently ship admin/admin on the public Grafana.
            # Fail before touching any container — the running stack is untouched.
            if [ -z "${GRAFANA_ADMIN_PASSWORD:-}" ]; then
              echo "ERROR: GRAFANA_ADMIN_PASSWORD is empty — refusing to deploy with the default 'admin' password. Set the GRAFANA_ADMIN_PASSWORD repository secret." >&2
              exit 1
            fi

            # Refuse to deploy without an alert webhook. Grafana provisions its
            # contact point from this URL and exits during startup when it is
            # empty, so an unset secret would take the whole monitoring stack
            # down — and a compose default would leave alerts silently undelivered.
            if [ -z "${ALERT_WEBHOOK_URL:-}" ]; then
              echo "ERROR: ALERT_WEBHOOK_URL is empty — Grafana would fail to provision its alert contact point and exit. Set the ALERT_WEBHOOK_URL repository secret." >&2
              exit 1
            fi

            # TEMPORARY INSTRUMENTATION — remove once one deploy has been measured.
            #
            # On 2026-08-13 a deploy exhausted this host and it stopped scheduling
            # userspace until it was power-cycled. Which phase consumes the memory
            # is not known: the plausible candidates are layer decompression during
            # the pull and the server container's boot peak (179 MB against 71 MB
            # at rest), and `docker compose up -d` recreates sequentially, so the
            # "old and new container alive together" theory does not hold. Sampling
            # answers it; guessing does not.
            #
            # The sampler is bounded to 150 iterations (5 min) rather than looping
            # forever, because the same incident showed the script can stop being
            # executed entirely — an unbounded background loop would then outlive
            # the session on the very host that ran out of resources. Reading
            # /proc/meminfo costs nothing; nothing heavier runs here.
            MEM_LOG=/tmp/deploy-mem.log
            : > "$MEM_LOG"
            VMSTAT_BEFORE=$(awk '/^pswpin|^pswpout/{printf "%s=%s ", $1, $2}' /proc/vmstat)
            # stdin/stdout/stderr are detached deliberately. A backgrounded process
            # that keeps the SSH channel's descriptors open stops the session from
            # closing, and a deploy that hangs on its own diagnostics would be the
            # exact failure this instrumentation exists to explain.
            (
              for _ in $(seq 1 150); do
                awk -v t="$(date +%H:%M:%S)" \
                  '/^MemAvailable:/{a=$2} /^SwapFree:/{s=$2} END{print t, a, s}' \
                  /proc/meminfo >> "$MEM_LOG"
                sleep 2
              done
            ) </dev/null >/dev/null 2>&1 &
            MEM_SAMPLER=$!

            # Diagnostics must never change the outcome of a deploy. `set -e` is
            # disabled inside the report so one unavailable counter cannot cut it
            # short, and the entry status is captured first and re-raised at the
            # end — without that, a failing command in an EXIT trap replaces the
            # script's exit code and reports a successful deploy as a failure.
            report_memory() {
              rc=$?
              set +e
              kill "$MEM_SAMPLER" 2>/dev/null
              echo "=== deploy memory report ==="
              echo "--- lowest MemAvailable samples (time, MemAvailable kB, SwapFree kB) ---"
              sort -k2 -n "$MEM_LOG" | head -8
              echo "--- last sample ---"
              tail -1 "$MEM_LOG"
              echo "--- pswpin/pswpout before: ${VMSTAT_BEFORE}"
              printf -- "--- pswpin/pswpout after:  "
              awk '/^pswpin|^pswpout/{printf "%s=%s ", $1, $2}' /proc/vmstat
              echo
              echo "--- container memory (name, current bytes, peak bytes) ---"
              for c in $(docker ps --format '{{.Names}}' 2>/dev/null); do
                pid=$(docker inspect -f '{{.State.Pid}}' "$c" 2>/dev/null)
                rel=$(awk -F: '$1=="0"{print $3}' "/proc/${pid}/cgroup" 2>/dev/null)
                cur=$(cat "/sys/fs/cgroup${rel}/memory.current" 2>/dev/null || echo n/a)
                peak=$(cat "/sys/fs/cgroup${rel}/memory.peak" 2>/dev/null || echo n/a)
                echo "$c $cur $peak"
              done
              echo "=== end memory report ==="
              exit "$rc"
            }
            trap report_memory EXIT

            echo "PHASE sync-env $(date +%H:%M:%S)"

            # Sync managed credentials (SMTP, JWT keys, DB_PASSWORD, OAuth, etc.)
            # from GitHub Secrets into server/.env (and root .env for DB_PASSWORD).
            # Source of truth is the secrets, so a from-scratch rebuild restores
            # them; each key is written only when its secret is non-empty, so this
            # is a safe no-op for any secret not yet populated. See the script.
            bash scripts/sync-prod-env.sh

            echo "PHASE pull $(date +%H:%M:%S)"
            docker compose pull
            echo "PHASE up $(date +%H:%M:%S)"
            docker compose up -d --remove-orphans
            echo "PHASE health $(date +%H:%M:%S)"

            # Health check with timeout — require ALL services with healthcheck to be healthy
            echo "Waiting for services to become healthy..."
            EXPECTED=$(docker compose config 2>/dev/null | grep -c 'healthcheck:' || true)
            if [ "$EXPECTED" -lt 1 ]; then EXPECTED=4; fi
            echo "Expecting $EXPECTED services with healthcheck"
            TIMEOUT=120
            ELAPSED=0
            HEALTHY=0
            while [ $ELAPSED -lt $TIMEOUT ]; do
              if docker compose ps --format '{{.Health}}' | grep -q 'unhealthy'; then
                sleep 5
                ELAPSED=$((ELAPSED + 5))
                continue
              fi
              HEALTHY=$(docker compose ps --format '{{.Health}}' | grep -c 'healthy' || true)
              if [ "$HEALTHY" -ge "$EXPECTED" ]; then
                break
              fi
              sleep 5
              ELAPSED=$((ELAPSED + 5))
            done

            if [ "$HEALTHY" -ge "$EXPECTED" ]; then
              echo "Deploy successful — sha-${DEPLOY_SHA}"
              cp -f .deployed-sha .prev-deployed-sha 2>/dev/null || true
              echo "$DEPLOY_SHA" > .deployed-sha
              docker image prune -f
              exit 0
            fi

            # Health check failed — attempt rollback
            echo "Health check failed after ${TIMEOUT}s"

            if [ -z "$PREV_SHA" ]; then
              echo "No previous version on record — bringing services down"
              docker compose down
              exit 1
            fi

            echo "Rolling back to sha-${PREV_SHA}"
            docker pull "ghcr.io/${OWNER}/nexus-server:sha-${PREV_SHA}"
            docker pull "ghcr.io/${OWNER}/nexus-client:sha-${PREV_SHA}"
            docker tag "ghcr.io/${OWNER}/nexus-server:sha-${PREV_SHA}" "ghcr.io/${OWNER}/nexus-server:latest"
            docker tag "ghcr.io/${OWNER}/nexus-client:sha-${PREV_SHA}" "ghcr.io/${OWNER}/nexus-client:latest"

            # Restore docker-compose.yml to match the rollback target SHA
            git fetch --quiet origin
            git checkout "${PREV_SHA}" -- docker-compose.yml

            docker compose down
            docker compose up -d

            # Verify rollback health
            ELAPSED=0
            ROLLBACK_HEALTHY=0
            while [ $ELAPSED -lt $TIMEOUT ]; do
              if docker compose ps --format '{{.Health}}' | grep -q 'unhealthy'; then
                sleep 5
                ELAPSED=$((ELAPSED + 5))
                continue
              fi
              ROLLBACK_HEALTHY=$(docker compose ps --format '{{.Health}}' | grep -c 'healthy' || true)
              if [ "$ROLLBACK_HEALTHY" -ge "$EXPECTED" ]; then
                break
              fi
              sleep 5
              ELAPSED=$((ELAPSED + 5))
            done

            if [ "$ROLLBACK_HEALTHY" -ge "$EXPECTED" ]; then
              echo "Rolled back to sha-${PREV_SHA} successfully"
            else
              echo "Rollback health check also failed — manual intervention required"
            fi

            exit 1
        env:
          DEPLOY_SHA: ${{ needs.build-push.outputs.sha }}
          OWNER: ${{ needs.build-push.outputs.owner }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          GRAFANA_ROOT_URL: ${{ secrets.GRAFANA_ROOT_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FACEBOOK_CLIENT_SECRET: ${{ secrets.FACEBOOK_CLIENT_SECRET }}
          VK_CLIENT_SECRET: ${{ secrets.VK_CLIENT_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
          PADDLE_WEBHOOK_SECRET: ${{ secrets.PADDLE_WEBHOOK_SECRET }}
          YOOKASSA_SHOP_ID: ${{ secrets.YOOKASSA_SHOP_ID }}
          YOOKASSA_SECRET_KEY: ${{ secrets.YOOKASSA_SECRET_KEY }}
