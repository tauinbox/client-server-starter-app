name: Preseed SSH client
description: >-
  Installs the drone-ssh client that appleboy/ssh-action downloads at run time,
  taking it from the Actions cache and verifying it against a pinned checksum.
  The action's entrypoint skips its own download when the binary is already
  present, so a deploy no longer depends on a third-party release URL being
  reachable, and the executable that runs with the VPS key is pinned by digest
  instead of being trusted on arrival.

  It also derives the host fingerprint every SSH job needs, so that derivation
  lives here once instead of at each call site.

inputs:
  host_key:
    description: >-
      The VPS host's public key in `ssh-keyscan` output format, from the
      VPS_HOST_KEY secret. Exactly one key line, and it must be the ECDSA one
      — see the note on the derivation step.
    required: true
  version:
    description: drone-ssh release to install. Must match the version appleboy/ssh-action expects.
    required: false
    default: '1.8.2'
  sha256:
    description: >-
      sha256 of the linux-amd64 asset for that release, from the release's
      checksums.txt. Bump together with `version`.
    required: false
    default: '1e10a9972eef167d9ddbc39e1ba80f7d44a011b4a6bc4f6149434154d9b6bb24'

outputs:
  cache-hit:
    description: >-
      'true' when the client came from the cache, so the run touched no
      third-party release URL at all.
    value: ${{ steps.cache.outputs.cache-hit }}
  fingerprint:
    description: >-
      SHA256 fingerprint of `host_key`, in the `SHA256:...` form the
      `fingerprint` input of appleboy/ssh-action expects. Pass it there so the
      client verifies which host it is handing the deploy key to.
    value: ${{ steps.host-key.outputs.fingerprint }}

runs:
  using: composite
  steps:
    # First, so an unusable host key fails before any work is done.
    #
    # The guard is not defensive noise: drone-ssh falls back to
    # ssh.InsecureIgnoreHostKey() when the fingerprint is empty, and a runner
    # starts every run with an empty known_hosts, so an unset secret would
    # silently restore the unverified behaviour this exists to remove.
    #
    # The secret must hold the host's ECDSA key specifically. A host answering
    # with three host keys hands over whichever one the client asks for, and
    # drone-ssh's Go client puts ecdsa-sha2-nistp256 above ssh-ed25519 in
    # golang.org/x/crypto's defaultHostKeyAlgos — so an ed25519 fingerprint
    # here is compared against an ECDSA key and every job fails with
    # "host key fingerprint mismatch". Local OpenSSH prefers ed25519 and will
    # happily verify against it, which makes the wrong key look correct until
    # a real run.
    - name: Derive the host fingerprint
      id: host-key
      shell: bash
      env:
        HOST_KEY: ${{ inputs.host_key }}
      run: |
        set -euo pipefail
        if [ -z "${HOST_KEY:-}" ]; then
          echo "ERROR: host_key is empty — refusing to connect without verifying the host. Set the VPS_HOST_KEY repository secret to the output of 'ssh-keyscan -t ecdsa <host>', checked against /etc/ssh/ssh_host_ecdsa_key.pub on the host itself." >&2
          exit 1
        fi

        KEY_FILE="${RUNNER_TEMP}/vps_host_key"
        printf '%s\n' "${HOST_KEY}" > "${KEY_FILE}"

        # One key in, one fingerprint out. The action's input takes a single
        # value, so a secret holding several keys would quietly verify against
        # whichever one came first.
        KEY_COUNT="$(ssh-keygen -lf "${KEY_FILE}" | wc -l)"
        if [ "${KEY_COUNT}" -ne 1 ]; then
          echo "ERROR: VPS_HOST_KEY holds ${KEY_COUNT} keys, expected exactly 1." >&2
          exit 1
        fi

        # Catch the wrong key type here rather than as an opaque
        # "host key fingerprint mismatch" from the client three steps later.
        KEY_TYPE="$(ssh-keygen -lf "${KEY_FILE}" | sed -n 's/.*(\(.*\))$/\1/p')"
        if [ "${KEY_TYPE}" != "ECDSA" ]; then
          echo "ERROR: VPS_HOST_KEY is an ${KEY_TYPE} key; the client negotiates ECDSA and would compare its fingerprint against this one. Re-take the secret with 'ssh-keyscan -t ecdsa <host>'." >&2
          exit 1
        fi

        echo "fingerprint=$(ssh-keygen -lf "${KEY_FILE}" | cut -d ' ' -f2)" >> "${GITHUB_OUTPUT}"

    # Keyed on the checksum, so a version bump can never restore the old binary
    # and the key never has to be invalidated by hand.
    - name: Restore the SSH client from the cache
      id: cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/drone-ssh
        key: drone-ssh-${{ inputs.version }}-linux-amd64-${{ inputs.sha256 }}

    # Only reached on a cache miss (first run after a version bump, or after the
    # 7-day eviction). Retries harder than the action's own curl, which gave up
    # after 6 attempts during the 2026-08-12 release-URL outage.
    - name: Download the SSH client
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        BIN="drone-ssh-${VERSION}-linux-amd64"
        mkdir -p ~/.cache/drone-ssh
        curl -fsSL --retry 10 --retry-all-errors --retry-delay 5 \
          -o ~/.cache/drone-ssh/"${BIN}" \
          "https://github.com/appleboy/drone-ssh/releases/download/v${VERSION}/${BIN}"

    - name: Verify the checksum and install it into the action path
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        BIN="drone-ssh-${VERSION}-linux-amd64"
        echo "${SHA256}  ${HOME}/.cache/drone-ssh/${BIN}" | sha256sum -c -

        # Where the action's entrypoint looks: "${GITHUB_ACTION_PATH}/${BIN}",
        # with GITHUB_ACTION_PATH being the runner's checkout of the action.
        ACTION_DIR="$(dirname "${RUNNER_WORKSPACE}")/_actions/appleboy/ssh-action/v1"
        if [ ! -d "${ACTION_DIR}" ]; then
          echo "ERROR: ${ACTION_DIR} does not exist — appleboy/ssh-action@v1 is not used by this job, or its checkout path changed." >&2
          exit 1
        fi
        install -m 0755 ~/.cache/drone-ssh/"${BIN}" "${ACTION_DIR}/${BIN}"

        # Pin the version for the action itself: it defaults to a version of its
        # own choosing, and a future @v1 release could move it off the binary
        # installed here, silently putting the download back on the deploy path.
        echo "DRONE_SSH_VERSION=${VERSION}" >> "${GITHUB_ENV}"
